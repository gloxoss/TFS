# Redirect www to non-www (HTTP)
server {
    listen 80;
    server_name www.tfs.ma;
    return 301 https://tfs.ma$request_uri;
}

# Redirect www to non-www (HTTPS)
server {
    listen 443 ssl;
    server_name www.tfs.ma;

    ssl_certificate /etc/letsencrypt/live/tfs.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tfs.ma/privkey.pem;

    return 301 https://tfs.ma$request_uri;
}

# Main HTTP - redirect to HTTPS
server {
    listen 80;
    server_name tfs.ma;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS
server {
    listen 443 ssl;
    server_name tfs.ma;

    ssl_certificate /etc/letsencrypt/live/tfs.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tfs.ma/privkey.pem;

    location /api/ {
        proxy_pass http://pocketbase:8090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_/ {
        proxy_pass http://pocketbase:8090/_/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
