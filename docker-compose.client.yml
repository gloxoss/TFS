version: '3.8'

# TFS Client Deployment
# Run with: docker compose up -d

services:
  # Next.js Web Application
  web:
    image: tfs-web:latest
    container_name: tfs-web
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_POCKETBASE_URL=http://pocketbase:8090
      # Client should update these if needed, or you bake them in
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost}
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - tfs-internal

  # PocketBase Database
  pocketbase:
    image: tfs-pb:latest
    container_name: tfs-pb
    restart: always
    expose:
      - "8090"
    volumes:
      - pb_data:/pb/pb_data
      # No migration mount needed - baked into image
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health" ]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - tfs-internal

  # Nginx Reverse Proxy (Optional - if they need SSL/Domain handling)
  nginx:
    image: nginx:alpine
    container_name: tfs-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - tfs-internal

networks:
  tfs-internal:
    driver: bridge

volumes:
  pb_data:
    driver: local
