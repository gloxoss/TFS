version: '3.8'

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: tfs-next-app
    restart: always
    ports:
      - "3002:3000"
    env_file:
      - .env
    # environment:
    #   - NEXT_PUBLIC_POCKETBASE_URL=...
    # networks:
    #   - tfs-network

  pocketbase:
    build:
      context: ./pb_docker
    container_name: tfs-pocketbase-new
    restart: always
    ports:
      - "8091:8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health" ]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    # networks:
    #   - tfs-network

    # networks:
    #   tfs-network:
    #     driver: bridge
