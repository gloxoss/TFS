version: '3.8'

# =============================================================================
# TFS Docker Test Deployment
# =============================================================================
# This configuration runs on ALTERNATE PORTS to test Docker deployment
# alongside the existing PM2/systemd deployment:
# - Web App: http://VPS_IP:3002 (instead of 3000)
# - PocketBase: http://VPS_IP:8092 (instead of 8090)
# =============================================================================

services:
  # ===========================================================================
  # Next.js Web Application (Test Instance)
  # ===========================================================================
  web:
    image: tfs-web:latest
    container_name: tfs-web-test
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_POCKETBASE_URL=http://pocketbase:8090
      - NEXT_PUBLIC_SITE_URL=http://72.62.27.47:3002
      - NEXT_PUBLIC_SITE_NAME=TV Film Solutions
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - tfs-test-network

  # ===========================================================================
  # PocketBase Database (Test Instance)
  # ===========================================================================
  pocketbase:
    image: tfs-pb:latest
    container_name: tfs-pb-test
    restart: unless-stopped
    ports:
      - "8092:8090"
    volumes:
      - ./pb_data:/pb/pb_data
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health" ]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - tfs-test-network

# =============================================================================
# Networks
# =============================================================================
networks:
  tfs-test-network:
    driver: bridge
