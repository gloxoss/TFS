version: '3.8'

# =============================================================================
# TFS Production Docker Compose - Enhanced Security
# =============================================================================
# This configuration is designed for client VPS deployment with:
# - Internal networking (PocketBase not exposed externally)
# - Nginx reverse proxy for SSL termination
# - Health checks and restart policies
# - Volume persistence for database
# =============================================================================

services:
  # ===========================================================================
  # Next.js Web Application
  # ===========================================================================
  web:
    image: tfs-next-app:${VERSION:-latest}
    container_name: tfs-next-app
    restart: always
    expose:
      - "3000"  # Internal only - Nginx handles external traffic
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_POCKETBASE_URL=${NEXT_PUBLIC_POCKETBASE_URL:-http://pocketbase:8090}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - NEXT_PUBLIC_SITE_NAME=${NEXT_PUBLIC_SITE_NAME}
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - tfs-internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # PocketBase Database
  # ===========================================================================
  pocketbase:
    image: tfs-pocketbase:${VERSION:-latest}
    container_name: tfs-pocketbase
    restart: always
    # SECURITY: No external port exposure - only accessible via internal network
    expose:
      - "8090"
    volumes:
      - pb_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations:ro  # Read-only migrations
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - tfs-internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Nginx Reverse Proxy
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: tfs-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - web
    networks:
      - tfs-internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # PocketBase Admin Access (Optional - comment out in production)
  # ===========================================================================
  # Uncomment this service only when you need direct PB admin access
  # pocketbase-admin:
  #   image: tfs-pocketbase:${VERSION:-latest}
  #   container_name: tfs-pocketbase-admin
  #   restart: "no"
  #   ports:
  #     - "127.0.0.1:8091:8090"  # Localhost only!
  #   volumes:
  #     - pb_data:/pb/pb_data
  #   networks:
  #     - tfs-internal
  #   profiles:
  #     - admin  # Only starts with: docker compose --profile admin up pocketbase-admin

# =============================================================================
# Networks
# =============================================================================
networks:
  tfs-internal:
    driver: bridge
    internal: false  # Allow outbound (for email, etc.)

# =============================================================================
# Volumes
# =============================================================================
volumes:
  pb_data:
    driver: local
